<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ultra Retro Demo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:monospace}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#151525,#000);color:#fff;font-size:24px;cursor:pointer;user-select:none;text-align:center;line-height:1.4}
#hud{position:fixed;left:12px;top:10px;color:#8ff;opacity:.8;font-size:12px;text-shadow:0 0 8px #000}
</style>
</head>
<body>
<div id="start">KLICK ZUM START<br><span style="font-size:14px;opacity:.8">ULTRA RETRO DEMO</span></div>
<div id="hud">ROTOZOOM / STARFIELD / COPPERS / SCROLLER / CHIP SOUND</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),start=document.getElementById('start');
let W,H,D,t=0,ok=false,audioCtx,master;
function resize(){D=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*D;H=c.height=innerHeight*D;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px'}
addEventListener('resize',resize);resize();
const parts=[['BOOT',3.6],['STAR',5.2],['COPP',5.0],['ROTO',6.2],['SCROLL',6.0],['FINAL',6.5]];
const total=parts.reduce((a,p)=>a+p[1],0);
function phase(){let s=t%total,a=0;for(let i=0;i<parts.length;i++){if(s<a+parts[i][1])return [i,(s-a)/parts[i][1]];a+=parts[i][1]}return [0,0]}
function bg(){const grd=g.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H));grd.addColorStop(0,'#070814');grd.addColorStop(1,'#000');g.fillStyle=grd;g.fillRect(0,0,W,H)}
function scan(){g.fillStyle='rgba(0,0,0,.18)';for(let y=0;y<H;y+=3*D)g.fillRect(0,y,W,1*D)}
function text(txt,y,sz,col,sub){g.save();g.textAlign='center';g.textBaseline='middle';g.font=`bold ${Math.floor(sz*D)}px monospace`;g.shadowColor=col;g.shadowBlur=28*D;g.fillStyle='#fff';g.fillText(txt,W/2,y);g.shadowBlur=0;if(sub){g.font=`bold ${Math.floor(sz*.24*D)}px monospace`;g.fillStyle=col;g.fillText(sub,W/2,y+sz*.8*D)}g.restore()}
function stars(n,s){g.save();for(let i=0;i<n;i++){const z=((i*9973+t*s*120)%1000)/1000;const x=(Math.sin(i*12.3+z*9+t*s)*.5+.5)*W;const y=(Math.cos(i*44.7-z*7-t*s*.6)*.5+.5)*H;const a=.25+.75*z;const r=(1+3*z)*D;g.fillStyle=`rgba(180,220,255,${a})`;g.fillRect(x,y,r,r)}g.restore()}
function coppers(){for(let i=0;i<18;i++){const y=H*.2+i*16*D+Math.sin(t*3+i)*5*D;const c1=`rgba(${80+i*8},${180+i*4},255,.9)`;const c2=`rgba(255,80,220,.25)`;const grd=g.createLinearGradient(0,y,W,y);grd.addColorStop(0,'rgba(0,0,0,0)');grd.addColorStop(.45,c1);grd.addColorStop(.5,c2);grd.addColorStop(.55,c1);grd.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=grd;g.fillRect(0,y,W,5*D)}}
function scroller(y){const msg='*** ULTRA RETRO COMPETITION DEMO ***  ROTOZOOM  STARFIELD  COPPERS  SCROLLER  CHIPTUNE  *** ';const off=(t*170*D)%(msg.length*12*D);g.save();g.font=`bold ${Math.floor(18*D)}px monospace`;g.fillStyle='#8ff';g.shadowColor='#0ff';g.shadowBlur=10*D;for(let i=0;i<msg.length;i++){const x=W-off+i*12*D;if(x>-20*D&&x<W+20*D)g.fillText(msg[i],x,y)}g.restore()}
function rotozoom(){const size=110*D+Math.sin(t*2)*12*D;g.save();g.translate(W/2,H*.58);g.rotate(t*1.6);for(let yy=-6;yy<=6;yy++){for(let xx=-6;xx<=6;xx++){const px=xx*size*.16,py=yy*size*.16;const d=Math.sqrt(xx*xx+yy*yy);const a=Math.atan2(yy,xx)+t*2;const u=((Math.cos(a)*0.5+0.5)*255)|0;const v=((Math.sin(d+t*3)*0.5+0.5)*255)|0;g.fillStyle=`rgb(${u},${v},255)`;g.fillRect(px,py,size*.12,size*.12)}}g.restore()}
function wire(){g.save();g.translate(W/2,H/2);g.rotate(t*.45);for(let r=0;r<8;r++){const rad=(55+r*24)*D;g.beginPath();for(let a=0;a<=Math.PI*2+.01;a+=Math.PI/28){const wob=Math.sin(a*4+t*2+r)*10*D;const x=Math.cos(a)*rad;const y=Math.sin(a)*rad*.62+wob*.5;if(!a)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle=`rgba(${60+r*20},${220-r*12},255,.75)`;g.lineWidth=2*D;g.stroke()}g.restore()}
function final(){bg();stars(180,1.3);coppers();rotozoom();wire();text('WINNER MODE',H*.18,48,'#fff','SCENE READY');scroller(H*.84);scan()}
function boot(){bg();stars(120,0.7);text('ULTRA RETRO',H*.24,54,'#0ff','BOOTING...');coppers();scan()}
function starPart(){bg();stars(260,2.2);text('STARFIELD',H*.17,42,'#8ff','FAST FLIGHT');scan()}
function copPart(){bg();stars(150,1.0);coppers();text('COPPER BARS',H*.18,42,'#f0f','COLOR WAVE');scan()}
function rotoPart(){bg();stars(120,0.8);rotozoom();text('ROTOZOOM',H*.18,42,'#0ff','VECTOR FEEL');scan()}
function scrollPart(){bg();stars(140,1.1);wire();scroller(H*.84);text('SCROLLER',H*.18,42,'#8ff','TEXT IN MOTION');scan()}
function audio(){audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=.28;master.connect(audioCtx.destination);const b=(f,d,tp='square',v=.08)=>{const o=audioCtx.createOscillator(),a=audioCtx.createGain();o.type=tp;o.frequency.value=f;a.gain.value=.0001;o.connect(a);a.connect(master);a.gain.exponentialRampToValueAtTime(v,audioCtx.currentTime+.01);a.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d+.03)};let bi=0,li=0;setInterval(()=>{if(!ok)return;b([55,65,73,82,55,65,87,98][bi++%8],.13,'square',.06)},180);setInterval(()=>{if(!ok)return;const s=[440,494,523,587,659,587,523,494,440,392,349,392][li++%12];b(s,.09,'triangle',.045);if(li%4===0)b(s*2,.05,'sawtooth',.022)},120);setInterval(()=>{if(!ok)return;b(90,.08,'sine',.12)},500)}
function draw(){if(!ok)return; t+=1/60; const [p]=phase(); if(p===0)boot(); else if(p===1)starPart(); else if(p===2)copPart(); else if(p===3)rotoPart(); else if(p===4)scrollPart(); else final(); requestAnimationFrame(draw)}
start.onclick=()=>{if(ok)return;ok=true;start.remove();audio();draw()};
</script>
</body>
</html>
